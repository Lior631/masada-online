<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Masada Simulator 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F3E9D2; --muted:#CDBB97; --amber:#F2B33D; --red:#E04B3A; --scrim:rgba(18,14,9,.76); --panel:rgba(26,20,12,.9); --line:rgba(243,233,210,.22); --sand:#C9A273;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --scrim:rgba(10,8,5,.82); --panel:rgba(18,14,8,.92); } }
:root[data-theme="dark"]{ --scrim:rgba(10,8,5,.82); --panel:rgba(18,14,8,.92); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--sand);color:var(--ink);font-family:"Saira Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.stage{position:relative;height:100%;margin:0 auto;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none;font-size:1.6rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.hud[hidden]{display:none}
.lapis{display:inline-block;width:.95em;height:.95em;vertical-align:-.14em;margin:0 .28em 0 .1em;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M6%203h12l5%206-11%2013L1%209z%27%20fill%3D%27%235FD3F3%27%20stroke%3D%27%230E6E8C%27%20stroke-width%3D%271.2%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M1%209h22M6%203l3%206%203-6%203%206%203-6M9%209l3%2013%203-13%27%20fill%3D%27none%27%20stroke%3D%27%230E6E8C%27%20stroke-width%3D%27.9%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M6%203l3%206H1z%27%20fill%3D%27%23B8F1FF%27%2F%3E%3Cpath%20d%3D%27M12%203l3%206H9z%27%20fill%3D%27%23E8FCFF%27%2F%3E%3Cpath%20d%3D%27M9%209h6l-3%2013z%27%20fill%3D%27%239BE7FA%27%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 .15em rgba(60,100,255,.6))}
.actBtn{position:absolute;width:58px;height:58px;border-radius:50%;clip-path:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  border:3px solid var(--amber);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.45);touch-action:none;font-size:1.5rem}
.actBtn small{font-size:.65rem;font-weight:700;margin-top:2px;color:var(--amber)}
.actBtn[hidden]{display:none}
.actBtn:active{transform:scale(.92)}
.actBtn.cool{opacity:.5}
.actBtn::after{content:"";position:absolute;inset:-8px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--amber) calc(var(--p,0)*1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#jumpBtn{right:24px;bottom:106px;background:radial-gradient(circle at 40% 35%,#4F8FD6,#1F4F96 70%)}
#boostBtn{right:112px;bottom:106px;background:radial-gradient(circle at 40% 35%,#F2C94C,#B07A10 70%)}
body.rot #jumpBtn{right:18px;bottom:88px;width:50px;height:50px;font-size:1.3rem} body.rot #boostBtn{right:100px;bottom:88px;width:50px;height:50px;font-size:1.3rem}
@media (max-height:560px){ #jumpBtn{right:18px;bottom:88px;width:50px;height:50px;font-size:1.3rem} #boostBtn{right:100px;bottom:88px;width:50px;height:50px;font-size:1.3rem} }
.modeQ{align-self:center;font-size:1.15rem;color:var(--muted)}
.screen button.modeOpt{font-size:1.1rem;padding:.2em .8em;min-height:40px}
.screen button.modeOpt.on{background:var(--amber);color:#1E160B;box-shadow:none}
.modeBtn{position:absolute;right:208px;bottom:28px;width:54px;height:54px;border-radius:12px;clip-path:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:linear-gradient(160deg,#4A4F3A,#23261B);border:2px solid var(--amber);color:#fff;font-size:1.4rem;box-shadow:0 3px 10px rgba(0,0,0,.4);touch-action:none}
.modeBtn small{font-size:.5rem;white-space:nowrap;font-weight:700;color:var(--amber);margin-top:2px}
.modeBtn[hidden]{display:none}
.modeBtn:active{transform:scale(.92)}
body.rot .modeBtn{right:176px;bottom:20px;width:46px;height:46px;font-size:1.2rem}
@media (max-height:560px){ .modeBtn{right:176px;bottom:20px;width:46px;height:46px;font-size:1.2rem} }
.fireBtn{position:absolute;left:auto;right:102px;bottom:18px;width:96px;height:74px;border-radius:18px;clip-path:none;padding:4px 6px;
  background:linear-gradient(160deg,#4A4F3A,#23261B);border:3px solid var(--amber);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none}
.fireBtn[hidden]{display:none}
.fireBtn svg{width:78px;height:34px}
.fireBtn small{font-size:1rem;font-weight:700;color:var(--amber);line-height:1}
.fireBtn:active{transform:scale(.94)}
.fireBtn.busy{opacity:.6}
@media (max-height:560px){ .fireBtn{width:80px;height:62px;left:auto;right:86px;bottom:14px} .fireBtn svg{width:64px;height:28px} }
.coins .lapis{width:1em;height:1em}
.hpbar{position:relative;width:clamp(110px,30vw,170px);height:20px;background:rgba(20,15,8,.75);border:2px solid #FFB3B8;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.hpfill{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#8E0F16,#E0242B 60%,#FF6B6B);transition:width .2s}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;direction:ltr}
.hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 20px rgba(224,36,43,.0);transition:box-shadow .35s}
.hurt.on{box-shadow:inset 0 0 70px 24px rgba(224,36,43,.55);transition:none}
button{font:inherit;font-weight:600;cursor:pointer;border:0;color:#1E160B;background:var(--amber);padding:.3em 1.1em;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hud button{pointer-events:auto;background:var(--panel);color:var(--ink);font-size:1.1rem;min-width:44px;min-height:40px;padding:0 .6em}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:24px;gap:10px;background:var(--scrim);overflow-y:auto}
.screen[hidden]{display:none}
.screen h1{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:clamp(3rem,15vw,5.2rem);line-height:.9;margin:0;color:var(--amber);text-shadow:0 3px 0 rgba(0,0,0,.45)}
.screen h1 small{display:block;font-size:.42em;color:var(--ink);letter-spacing:.06em;margin-top:.25em}
.screen p{font-size:1.3rem;margin:.1em 0;max-width:26ch;color:var(--muted)}
.screen .big{font-family:"Saira Stencil One",Impact,sans-serif;font-size:2.8rem;color:var(--amber);margin:0}
.screen button.go{font-size:1.6rem;margin-top:10px}
.screen button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:16px;font-size:1.1rem;color:var(--muted);margin-top:6px;flex-wrap:wrap;justify-content:center}
.legend b{font-weight:600;color:var(--amber)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gunlist{list-style:none;margin:6px 0 0;padding:0;width:min(100%,380px);display:flex;flex-direction:column}
.gunlist .fam{display:flex;align-items:center;gap:8px;margin-top:14px;padding-bottom:4px;border-bottom:2px solid var(--amber);text-align:left}
.gunlist .fam b{font-family:"Saira Stencil One",Impact,sans-serif;font-weight:400;font-size:1.3rem;color:var(--amber)}
.gunlist .fam span{font-size:.95rem;color:var(--muted);line-height:1.1}
.gunlist .g{display:flex;align-items:center;gap:10px;text-align:left;border-bottom:1px solid var(--line);padding:6px 0}
.gunlist .g.eq{background:rgba(242,179,61,.12)}
.gunlist .g .tx{flex:1;line-height:1.1}
.gunlist .g .tx b{display:block;font-weight:600;font-size:1.15rem}
.gunlist .g .tx span{font-size:.95rem;color:var(--muted)}
.gunlist button{font-size:1rem;min-width:96px;min-height:38px}
.gunlist button:disabled{opacity:.35;cursor:default}
.gunlist .tag{min-width:96px;text-align:center;color:var(--amber);font-weight:600}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.12em;margin-right:.28em;position:relative;
  background:radial-gradient(circle at 35% 30%,#FFF6C2 0%,#FFD84A 35%,#E9A916 70%,#9C6406 100%);
  box-shadow:inset 0 0 0 .07em #B97A0C,0 0 .35em rgba(255,200,60,.55)}
.coin::after{content:"";position:absolute;inset:.17em;border-radius:50%;border:.06em solid rgba(150,95,10,.7)}
.gren{position:absolute;right:16px;bottom:18px;width:74px;height:74px;border-radius:50%;clip-path:none;padding:0;
  background:radial-gradient(circle at 40% 35%,#FF5A5A,#C4161C 60%,#6E0A0E);border:3px solid #FFB3B8;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:none}
.gren[hidden]{display:none}
.gren::after{content:"";position:absolute;inset:-9px;border-radius:50%;pointer-events:none;
  background:conic-gradient(#FFB3B8 calc(var(--p,0)*1%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.gren .gi{font-size:1.7rem}
.gren .gc{font-size:1.05rem;font-weight:600;margin-top:2px}
.gren:disabled{opacity:.45}
.gren:active{transform:scale(.94)}
.ruby{display:inline-block;width:.8em;height:.8em;vertical-align:-.08em;margin:0 .28em 0 .1em;
  clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%);
  background:linear-gradient(160deg,#FFB3B8 0%,#FF3B4E 25%,#D0021B 55%,#7A0010 100%);filter:drop-shadow(0 0 .25em rgba(255,40,60,.7))}
.rg{display:inline-block;position:relative;width:.75em;height:.9em;border-radius:45%;vertical-align:-.12em;margin-right:.3em;
  background:radial-gradient(circle at 35% 35%,#FF8A8A,#E0182E 45%,#7A0010);box-shadow:0 0 .3em rgba(255,40,60,.6)}
.rg::before{content:"";position:absolute;left:30%;top:-.22em;width:40%;height:.25em;background:#B9B9B0;border-radius:2px}
.gren .rg{font-size:1.9rem;margin:0}
.gunlist button.redbtn{background:#D0202A;color:#fff}
.rotate{display:none;position:fixed;inset:0;z-index:50;background:#1A140C;color:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-size:1.5rem}
.rotate .ph{width:46px;height:78px;border:4px solid var(--amber);border-radius:10px;animation:turn 1.8s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
}
.langBtn{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 10px 8px 8px;background:var(--panel);color:var(--ink);border:2px solid var(--amber);border-left:0;clip-path:none;border-radius:0 14px 14px 0;font-size:1.5rem;line-height:1}
.langBtn small{font-size:.8rem;font-weight:600;color:var(--amber)}
.langBtn[hidden]{display:none}
.exitBtn{position:absolute;top:10px;right:10px;z-index:6;padding:8px 16px;background:#C62828;color:#fff;border:2px solid #fff;border-radius:12px;font-size:1.05rem;font-weight:800;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:pointer}
.exitBtn[hidden]{display:none}
.opp{margin:4px auto 0;width:78%;background:rgba(25,8,6,.8);border:2px solid #E0242B;border-radius:9px;padding:2px 8px 4px;color:#fff;font-weight:800;font-size:.85rem;text-align:center;line-height:1.2}
.opp[hidden]{display:none}
.oppbar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:2px;overflow:hidden}
.oppbar i{display:block;height:100%;width:0;background:#FF4A3D;transition:width .2s}
[dir=rtl] .exitBtn{right:auto;left:10px}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;width:min(100%,620px)}
.langs button{font-size:1.1rem;background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:44px}
.langs button.on{background:var(--amber);color:#1E160B}
.langin{font:inherit;font-size:1.1rem;padding:.35em .6em;min-height:44px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:min(60vw,260px)}
.langin:focus-visible{outline:3px solid var(--amber)}
.screen i{font-style:normal}
.box{width:130px;height:115px;margin:14px auto 6px;position:relative;border-radius:12px;background:linear-gradient(#E0242B,#7A0010);border:4px solid #F2B33D;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 -10px 0 rgba(0,0,0,.2)}
.box::before{content:"";position:absolute;left:-4px;right:-4px;top:26px;height:10px;background:#F2B33D}
.box::after{content:"";position:absolute;top:-4px;bottom:-4px;left:50%;width:14px;transform:translateX(-50%);background:#F2B33D;opacity:.9}
.box .bi{position:relative;z-index:1;font-size:3.4rem;line-height:1;color:#FFE29A;text-shadow:0 2px 6px rgba(0,0,0,.6);background:rgba(60,0,8,.75);border-radius:50%;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
.box .bi .coin,.box .bi .ruby{margin:0}
.box.shake{animation:shake .12s linear infinite}
.box.pop{animation:pop2 .5s ease-out}
@keyframes shake{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
@keyframes pop2{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.boxres{font-size:1.6rem!important;color:var(--amber)!important;font-weight:600;min-height:1.4em}
@media (prefers-reduced-motion: reduce){.box.shake,.box.pop{animation:none}}
 #scare{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;pointer-events:none}
#scare[hidden]{display:none}
#scare #jaw{animation:jawDrop .28s ease-in .05s forwards}
@keyframes jawDrop{0%{transform:none}60%{transform:translateY(9px) rotate(-4deg)}100%{transform:translateY(7px) rotate(2deg)}}
#scare .eyeGlow{animation:eyePulse .09s steps(2) infinite}
@keyframes eyePulse{0%{opacity:1}100%{opacity:.35}}
#dread{position:absolute;inset:0;z-index:59;background:#000;opacity:0;pointer-events:none;transition:opacity 1.3s ease-in}
#dread.on{opacity:.93}
#dread[hidden]{display:none}
#dread .whisper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-size:clamp(1rem,4vmin,1.6rem);color:#7A0A0A;letter-spacing:.3em;opacity:.0;animation:whisper 1.3s ease-in forwards}
@keyframes whisper{60%{opacity:0}100%{opacity:.9}}
#won.glitch .big{animation:wonGlitch .09s steps(1) infinite!important}
@keyframes wonGlitch{0%{opacity:1;filter:none}50%{opacity:.2;filter:hue-rotate(160deg) blur(2px);transform:skewX(20deg) scale(1.1)}}
#scare.closer svg{animation:scareZoom .5s cubic-bezier(.5,0,.9,.4) forwards, scareShake .03s linear infinite, scareFlick .12s steps(1) infinite}
@keyframes scareZoom{from{transform:scale(1.35)}to{transform:scale(3.2) translateY(6%)}}
#scare .boo.big2{font-size:clamp(3rem,16vmin,10rem);right:auto;bottom:auto;top:4%;letter-spacing:.05em}
#scareNoise{position:absolute;inset:0;width:100%;height:100%;opacity:.35;mix-blend-mode:screen}
#scare svg{position:relative;height:min(96vh,130vw);width:auto;animation:scareIn .12s ease-out forwards, scareShake .05s linear infinite, scareFlick .2s steps(1) infinite}
@keyframes scareFlick{0%{filter:none}50%{filter:invert(1) contrast(1.6)}60%{filter:none}}
#scare .boo{position:absolute;bottom:1%;right:4%;font-family:"Saira Stencil One",Impact,sans-serif;font-size:clamp(2.5rem,11vmin,7rem);color:#FF1E1E;text-shadow:0 0 30px #F00,4px 4px 0 #300;animation:scareShake .06s linear infinite}
#scare::after{content:"";position:absolute;inset:0;background:#F00;mix-blend-mode:overlay;animation:scareFlash .12s steps(2) infinite}
@keyframes scareIn{from{transform:scale(.2)}to{transform:scale(1.35)}}
@keyframes scareShake{0%{translate:0 0}25%{translate:-8px 5px}50%{translate:7px -6px}75%{translate:-5px -4px}100%{translate:6px 6px}}
@keyframes scareFlash{0%{opacity:.5}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){#scare svg,#scare .boo,#scare::after{animation:none}}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#won{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(ellipse at center,rgba(255,220,120,.18),rgba(20,12,0,.55))}
#won[hidden]{display:none}
#won .big{font-family:"Saira Stencil One",Impact,"Arial Black",sans-serif;font-size:clamp(3.6rem,17vw,9.5rem);line-height:1;color:#FFD34D;-webkit-text-stroke:3px #5A3A00;paint-order:stroke fill;
  text-shadow:6px 6px 0 #5A3A00,0 0 40px rgba(255,200,60,.8);white-space:nowrap;transform:scale(.2) rotate(-8deg);opacity:0;animation:wonIn .6s .05s cubic-bezier(.2,1.6,.4,1) forwards, wonBob 1.2s .7s ease-in-out infinite alternate}
@keyframes wonIn{to{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes wonBob{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){#won .big{animation:none;opacity:1;transform:none}}
#lost{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 20%,rgba(0,0,0,.7) 100%)}
#lost[hidden]{display:none}
#lost .wall{position:absolute;inset:-30%;display:flex;flex-wrap:wrap;gap:8px 26px;align-content:center;justify-content:center;transform:rotate(-12deg);opacity:0;
  animation:wallIn .9s .35s forwards, drift 9s linear infinite}
#lost .wall span{font-weight:600;font-size:1.35rem;color:rgba(255,255,255,.4);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#lost .big{position:relative;font-family:"Saira Stencil One",Impact,"Arial Black",sans-serif;font-size:clamp(3.6rem,17vw,9.5rem);line-height:1;color:#E3262E;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:6px 6px 0 #000,0 0 40px rgba(0,0,0,.9);letter-spacing:.03em;white-space:nowrap;
  transform:scale(2.4);opacity:0;animation:lostIn .45s .15s cubic-bezier(.2,1.5,.4,1) forwards}
#lost .bar{position:absolute;left:0;right:0;top:50%;height:clamp(90px,22vw,170px);transform:translateY(-50%) scaleY(0);background:rgba(0,0,0,.55);animation:barIn .3s forwards}
@keyframes lostIn{to{transform:scale(1);opacity:1}}
@keyframes wallIn{to{opacity:1}}
@keyframes drift{from{translate:0 0}to{translate:-120px 40px}}
@keyframes barIn{to{transform:translateY(-50%) scaleY(1)}}
canvas.wasted{filter:grayscale(1) contrast(1.2) brightness(.85);transform:scale(1.08);transition:filter 1.2s ease, transform 3.5s ease-out}
@media (prefers-reduced-motion: reduce){#lost .wall,#lost .big,#lost .bar{animation:none;opacity:1;transform:none}#lost .bar{transform:translateY(-50%)}canvas.wasted{transition:none;transform:none}}
.coins{font-size:1.4rem;color:#FFD34D!important;margin:0}
.hud .left{display:flex;flex-direction:column;line-height:1.05}
.hud .left small{font-size:1.05rem;color:#FFD34D}

.prizes .ic{font-size:1.5rem;width:1.6em;text-align:center}

.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:1.9rem;font-weight:600;color:var(--amber);pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap}
.toast.on{opacity:1}
.climb{direction:ltr;position:absolute;left:50%;top:54px;transform:translateX(-50%);width:min(84%,380px);pointer-events:none}
.climb[hidden]{display:none}
.climb .lbl{display:flex;justify-content:center;gap:10px;font-size:1.05rem;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8);margin-bottom:3px}
.climb .lbl b{color:var(--amber);font-weight:600}
.climb .track{position:relative;height:22px;background:rgba(20,15,8,.7);border:2px solid var(--amber);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.climb .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1rem;color:#fff;text-shadow:0 1px 3px #000}
.climb .rider{position:absolute;top:-10px;left:0;font-size:1.9rem;line-height:1;transform:translateX(-50%) scaleX(-1);transition:left .4s ease-out;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.climb .bar{position:relative;padding-top:12px}
.climb .fill{height:100%;width:0;background:linear-gradient(90deg,#C98A1F,#F2B33D 70%,#FFE29A);transition:width .4s ease-out}
.climb.bump .track{animation:bump .35s ease-out}
@keyframes bump{50%{transform:scaleY(1.35)}}
@media (prefers-reduced-motion: reduce){.climb .fill{transition:none}.climb.bump .track{animation:none}}
.achs{position:absolute;left:0;right:0;top:118px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.ach{display:flex;align-items:center;gap:10px;background:var(--panel);border-left:4px solid var(--amber);padding:5px 16px 5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:pop .25s ease-out;transition:opacity .3s,transform .3s;max-width:100%}
.ach .trophy{font-size:1.5rem;line-height:1}
.ach small{display:block;font-size:.9rem;color:var(--muted);line-height:1}
.ach b{font-weight:600;font-size:1.3rem;line-height:1.15}
.ach.out{opacity:0;transform:translateY(-8px)}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast,.ach{transition:none;animation:none}}

let samplePromise=null;
function getSample(){

function cleanJSON(txt){ const m=String(txt||'').replace(/```json|```/g,'').match(/\{[\s\S]*\}/); return m?JSON.parse(m[0]):null; }
async function translateChunk(sm,part,name){
  const prompt='Translate the VALUES of this JSON object from English into '+name+'. It is the interface of a mobile war game set at Masada. '
    +'Keep every key exactly the same. Keep placeholders like {n}, {name}, {desc} exactly as they are. Keep "XP" and the letter G unchanged. The red gem currency is called "Rubies" (one "Ruby"): keep that name, written in the target alphabet if needed. '
    +'Use the usual '+name+' name for Masada. Keep texts short and natural. Reply with ONLY the JSON object, nothing else.\n\n'+JSON.stringify(part);
  for (const tier of ['quick','quick']){
    try{
      const res=await sm(prompt,{modelTier:tier});
      const obj=cleanJSON(res&&res.text);
      if (obj && typeof obj==='object'){ const out={}; Object.keys(part).forEach(k=>{ if(typeof obj[k]==='string'&&obj[k].trim()) out[k]=obj[k]; }); if(Object.keys(out).length) return out; }
    }catch(e){ if(e&&(e.code==='not_granted'||e.code==='rate_limited'||e.code==='cancelled')) throw e; }
  }
  return {};
}
let translating=false;
async function pickLang(code,name){
  if (translating) return;
  $('langMsg').textContent='';
  if (code==='en'){ applyLang('en',EN); renderLangs(); return; }
  if (code==='he'){ applyLang('he',HE); renderLangs(); return; }
  const key='online-lang36-'+code;
  let dict={}; try{ dict=JSON.parse(localStorage.getItem(key)||'{}')||{}; }catch(e){ dict={}; }
  const missing=Object.keys(EN).filter(k=>k!=='title' && !dict[k]);
  if (!missing.length){ applyLang(code,dict); renderLangs(); return; }
  translating=true; $('langGo').disabled=true;
  $('langMsg').textContent=tr('lang_wait');
  const sm=await getSample();
  if (!sm){
    translating=false; $('langGo').disabled=false;
    if (Object.keys(dict).length){ applyLang(code,dict); renderLangs(); }
    $('langMsg').textContent=tr('lang_na'); return;
  }
  try{
    // screen texts first, then everything else; all parts run at the same time
    const FIRST=['intro','lg_triple','lg_shield','lg_life','b_start','b_prizes','b_guns','b_grens','b_langs','b_box','b_back','b_again','b_resume','coins_n','rubies_n','xp_line','best','lang_t','lang_count','lang_other','lang_go','paused','win_t','lose_t','climb'];
    const order=[...FIRST.filter(k=>missing.includes(k)), ...missing.filter(k=>!FIRST.includes(k))];
    const N=Math.min(8,Math.ceil(order.length/12)), size=Math.ceil(order.length/N), jobs=[];
    let done=0, shown=false;
    for (let i=0;i<order.length;i+=size){
      const part={}; order.slice(i,i+size).forEach(k=>part[k]=EN[k]);
      jobs.push(translateChunk(sm,part,name).then(res=>{
        Object.assign(dict,res); done++;
        try{ localStorage.setItem(key,JSON.stringify(dict)); }catch(e){}
        applyLang(code,dict); if(!shown){ shown=true; renderLangs(); }
        $('langMsg').textContent=done<jobs.length ? tr('lang_wait')+' '+Math.round(done/jobs.length*100)+'%' : '';
      }));
    }
    await Promise.all(jobs);
    applyLang(code,dict); renderLangs();
    const still=Object.keys(EN).filter(k=>k!=='title' && !dict[k]).length;
    $('langMsg').textContent= still ? tr('lang_partial') : '';
  }catch(e){
    if (Object.keys(dict).length){ applyLang(code,dict); renderLangs(); }
    $('langMsg').textContent = e&&e.code==='not_granted' ? tr('lang_denied') : e&&e.code==='rate_limited' ? tr('lang_busy') : tr('lang_fail');
  }
  translating=false; $('langGo').disabled=false;
}
function renderLangs(){

    const b=document.createElement('button'); b.textContent=native; b.title=eng; b.lang=code; if(code===lang) b.className='on';

}

const RAMPS=[[.44,.56,.28,.72],[.11,.16,.08,.2],[.84,.89,.8,.92]];
function wallSegs(){ const h=hz(), P=wallY(), out=[]; RAMPS.forEach(R=>{ out.push([W*R[0],h,W*R[2],P]); out.push([W*R[1],h,W*R[3],P]); }); return out; }

function ballistaPos(side){ const ps=persp(player.y); return {x:player.x+side*36*ps, y:player.y+6*ps, s:ps*.95}; }

// ---------- update ----------
function update(dt){
  t+=dt;
  if (player.jumpT>0) player.jumpT=Math.max(0,player.jumpT-dt);
  player.jumpCd=Math.max(0,player.jumpCd-dt);
  if (player.boostT>0){ const step=Math.min(dt,player.boostT); player.boostT=Math.max(0,player.boostT-dt);
    player.x+=player.dashDir*(W*.25/.35)*step; clampPlayer();
    player.trail.push({x:player.x,y:player.y}); if(player.trail.length>6) player.trail.shift(); }
  else if (player.trail.length){ player.trail.shift(); }
  player.boostCd=Math.max(0,player.boostCd-dt);
  $('jumpBtn').style.setProperty('--p', player.jumpCd>0 ? ((1-player.jumpCd/1.2)*100).toFixed(1) : 0); $('jumpBtn').classList.toggle('cool',player.jumpCd>0);
  $('boostBtn').style.setProperty('--p', player.boostT>0 ? (player.boostT/.35*100).toFixed(1) : player.boostCd>0 ? ((1-player.boostCd/5)*100).toFixed(1) : 0); $('boostBtn').classList.toggle('cool',player.boostCd>0 && player.boostT<=0);

  if (keys.left) player.x-=sp; if (keys.right) player.x+=sp; if (keys.up) player.y-=sp; if (keys.down) player.y+=sp;
  clampPlayer();
  player.inv=Math.max(0,player.inv-dt); player.triple=Math.max(0,player.triple-dt); player.shield=Math.max(0,player.shield-dt);
  player.mf=Math.max(0,player.mf-dt); shake=Math.max(0,shake-dt);
  player['rec-1']=Math.max(0,player['rec-1']-dt*1.6); player.rec1=Math.max(0,player.rec1-dt*1.6);
  const ps=persp(player.y);

  if (NET.role==='guest' && NET.live){ guestStep(dt); return; }
  const gun=gunById(equipped), st=gunStats(gun);
  // automatic fire is off: only the rifle button fires
  if (false){ fireT=st.rate*(owned.rapid?.66:1); volley(st,ps); if(st.burst){ player.burstLeft=st.burst-1; player.burstT=st.gap; } }
  if (player.b7>0 && state==='play'){ player.b7t-=dt; if(player.b7t<=0){ volley(st,ps,player.aimOff||0); player.b7--; player.b7t=owned.rapid?.035:.055; if(player.b7<=0) $('fireBtn').classList.remove('busy'); } }
  if (player.burstLeft>0 && state==='play'){ player.burstT-=dt; if(player.burstT<=0){ volley(st,ps); player.burstLeft--; player.burstT=st.gap; } }
  if (NET.role==='host' && NET.mate) hostMate(dt);
  const WSEG=wallSegs();
  bullets.forEach(b=>{
    if (b.homing){
      let best=null, bd=1e9; enemies.forEach(e=>{ if(e.hp>0){ const d=Math.hypot(e.x-b.x,e.y-b.y); if(d<bd){bd=d;best=e;} } });
      if (best){ const sp=Math.hypot(b.vx,b.vy), cur=Math.atan2(b.vy,b.vx), want=Math.atan2(best.y-b.y,best.x-b.x);
        let dA=want-cur; while(dA>Math.PI)dA-=Math.PI*2; while(dA<-Math.PI)dA+=Math.PI*2;
        const na=cur+Math.max(-6*dt,Math.min(6*dt,dA)); b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; }
    }
    const px=b.x, py=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if (b.wallB>0){ for (const sg of WSEG){ if (segHit(px,py,b.x,b.y,sg[0],sg[1],sg[2],sg[3])){
        let dx=sg[2]-sg[0], dy=sg[3]-sg[1]; const L=Math.hypot(dx,dy); const nx=-dy/L, ny=dx/L, dot=b.vx*nx+b.vy*ny;
        b.vx-=2*dot*nx; b.vy-=2*dot*ny; b.x=px; b.y=py; b.wallB--; b.hit=[]; burst(px,py,2,'spark'); break; } } }

    if (b.bounce>0 && b.y<hz()+8){ b.vy=Math.abs(b.vy); b.bounce--; b.hit=[]; }

  });
  bullets=bullets.filter(b=>!b.dead&&b.life>0&&b.y>hz()-30&&b.x>-20&&b.x<W+20&&b.y<H+20);
  if (newBullets.length){ bullets=bullets.concat(newBullets); newBullets=[]; }

  grenades.forEach(g=>{ g.k+=dt/.75; g.spin+=dt*12; if(g.k>=1){ g.done=true; landGrenade(g); } });

  booms.forEach(b=>{ b.t-=dt; if(b.t<=0){ b.done=true; explode(b.x,b.y,b.r||55,b.d||4); } });
  booms=booms.filter(b=>!b.done);
  flashT=Math.max(0,flashT-dt);
  if ((gren[grenType]||0)<5){ refillT-=dt; if(refillT<=0){ refillT=10; gren[grenType]=(gren[grenType]||0)+1; saveData(); toast(tr('t_gren')); } }
  else refillT=10;
  $('grenBtn').style.setProperty('--p', (gren[grenType]||0)<5 ? ((10-refillT)/10*100).toFixed(1) : 0);
  if (Math.floor(t*4)!==Math.floor((t-dt)*4)) showGren();
  zones.forEach(z=>{ z.t-=dt; z.tick-=dt; if(z.tick<=0){ z.tick=.25; enemies.forEach(e=>{ if(e.hp>0 && Math.hypot(e.x-z.x,(e.y-z.y)*1.6)<z.r) damage(e,1.5); }); }
    if (Math.random()<.5) parts.push({x:z.x+(Math.random()-.5)*z.r*1.6,y:z.y+(Math.random()-.5)*z.r*.9,vx:0,vy:-30-Math.random()*30,life:.5,max:.5,kind:'ember'}); });

function pathPoint(f){

    d-=segs[i];
  }
}

addEventListener('keyup',e=>{ if(map[e.key]) keys[map[e.key]]=false; });
let drag=null;
cv.addEventListener('pointerdown',e=>{ if(state!=='play')return; if (drag && drag.id!==e.pointerId) return; const q=toLocal(e); drag={id:e.pointerId,x:q.x,y:q.y,lx:q.x,ly:q.y,px:player.x,py:player.y}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drag||state!=='play')return;
  if (e.pointerId!==drag.id) return;
  const q=toLocal(e); let ddx=q.x-drag.lx, ddy=q.y-drag.ly; drag.lx=q.x; drag.ly=q.y;
  const jump=Math.hypot(ddx,ddy), lim=Math.max(60,Math.min(W,H)*.25); if (jump>lim){ ddx*=lim/jump; ddy*=lim/jump; }
  const m=1.2; if (ddx!==0) player.lastDir=Math.sign(ddx); player.x+=ddx*m; player.y+=ddy*m; clampPlayer(); });
const end=e=>{ if (drag && e.pointerId===drag.id) drag=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('lostpointercapture',end);

resize(); reset(); requestAnimationFrame(loop);
(()=>{ let code='en'; try{ code=localStorage.getItem('doodlewar-lang')||(/^(he|iw)/i.test(navigator.language||'')?'he':'en'); }catch(e){}
  if (code==='he') applyLang('he',HE);
  else if (code!=='en'){ let d=null; try{ d=JSON.parse(localStorage.getItem('online-lang36-'+code)||'null'); }catch(e){} applyLang(d?code:'en', d||EN); }
  else applyLang('en',EN); })();

// ---------- online share link: ?room=CODE auto-join ----------
(()=>{
  const he=()=>String(lang||'').slice(0,2)==='he';
  const L=(h,e)=>he()?h:e;
  const row=$('mpLeave').parentNode;
  const sh=document.createElement('button'); sh.className='go'; sh.id='mpShare'; sh.hidden=true; row.insertBefore(sh,$('mpLeave'));
  const web=/^https?:$/.test(location.protocol);
  const link=()=>location.origin+location.pathname+'?room='+NET.code;
  sh.onclick=async()=>{ const u=link(), txt=L('בוא לשחק איתי במצדה! קוד חדר '+NET.code+': ','Play Masada with me! Room '+NET.code+': ');
    try{ if(navigator.share){ await navigator.share({title:document.title,text:txt,url:u}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(u); toast(L('הקישור הועתק','Link copied')); }catch(e){ prompt(L('העתיקו את הקישור:','Copy the link:'),u); } };
  const base=mpStatus;
  mpStatus=function(){ base(); sh.textContent=L('🔗 שלחו קישור לחבר','🔗 Send link to friend'); sh.hidden=!(web && NET.r && NET.role==='host' && !NET.partner); };
  const q=new URLSearchParams(location.search).get('room');
  if (q && /^[0-9]{4}$/.test(q)){
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    setTimeout(()=>{ $('mpBtn').click(); $('mpCode').value=q; mpConnect('guest',q); },300);
  }
})();
})();
